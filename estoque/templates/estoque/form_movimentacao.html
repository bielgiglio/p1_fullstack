{% extends 'estoque/base.html' %}

{% block conteudo %}
    <div class="card form-container">
        <div class="card-header">
            <h3>Registrar Movimentação</h3>
        </div>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-primary">Salvar Registro</button>
        </form>
    </div>
{% endblock %}
